[project]
name = "scholarpulse-backend"
version = "1.0.0"
description = "ScholarPulse — Intelligent Research Discovery and Knowledge Mining Platform Backend"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg2-binary>=2.9.9",
    "pandas>=2.2.0",
    "numpy>=1.26.0,<2.2.0",
    "scikit-learn>=1.5.0",
    "mlxtend>=0.23.1",
    "nltk>=3.9.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --import-mode=importlib"
asyncio_mode = "auto"
